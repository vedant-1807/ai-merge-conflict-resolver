name: Bug report
description: A resolution or verification did not behave as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the job id or the PR where MergeAgent ran, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Logs or verification output
      render: text
